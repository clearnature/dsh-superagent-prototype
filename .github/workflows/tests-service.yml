name: Tests - service script and docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: Service script and built-in text
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm, Node and dependencies
        uses: ./.github/actions/setup
      - name: Run tests
        run: >-
          env -u GIT_CONFIG_GLOBAL -u GIT_CONFIG_SYSTEM pnpm exec vitest run
          tests/service-script.spec.ts tests/dsh-superagent.spec.ts tests/docs.spec.ts tests/cards.spec.ts tests/class-docs.spec.ts
