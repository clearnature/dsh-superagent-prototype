name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    name: Authorization and security boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm, Node and dependencies
        uses: ./.github/actions/setup
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Test authorization and security boundaries
        run: >-
          env -u GIT_CONFIG_GLOBAL -u GIT_CONFIG_SYSTEM pnpm exec vitest run
          tests/policy.spec.ts tests/commands.spec.ts tests/environment.spec.ts tests/http.spec.ts tests/github-read.spec.ts
